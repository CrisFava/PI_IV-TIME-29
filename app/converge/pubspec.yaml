name: converge
description: 'Aplicativo de caronas universitárias.'
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  cloud_firestore: ^7.0.0
  dio: ^5.11.1
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  firebase_storage: ^14.0.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  google_maps_flutter: ^2.19.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon.png"
  adaptive_icon_foreground_inset: 0

flutter_native_splash:
  color: "#ffffff"
  image: "assets/converge_logo_1.png"
  android_12:
    image: "assets/converge_logo_1.png"
    color: "#ffffff"

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/converge_logo_1.png
    - .env
