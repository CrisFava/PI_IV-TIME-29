spring:
  application:
    name: converge-backend
  profiles:
    active: dev
  # Lê as variáveis do .env sem precisar exportá-las no terminal (funciona em qualquer SO e IDE).
  # O primeiro caminho vale ao rodar dentro de converge-backend; o segundo, a partir da raiz do repositório.
  # Variáveis de ambiente já definidas continuam tendo prioridade sobre o arquivo.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:app/converge-backend/.env[.properties]
  docker:
    compose:
      enabled: false
  data:
    mongodb:
      uri: ${MONGODB_CONNECTION_STRING}
      auto-index-creation: true

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
    timeout: 5s