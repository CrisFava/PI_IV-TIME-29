name: Testes

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (mvn test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Executar testes
        run: ./mvnw -B test

  backend:
    name: Backend (mvn test)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: ${{ secrets.MONGO_CI_USER }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_CI_PASSWORD }}
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_CONNECTION_STRING: mongodb://${{ secrets.MONGO_CI_USER }}:${{ secrets.MONGO_CI_PASSWORD }}@localhost:27017/?authSource=admin
      ENV_CHECK: ci
    defaults:
      run:
        working-directory: app/converge-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # O backend depende do artefato com.converge:server, que precisa estar no repositório Maven local.
      - name: Instalar dependência server
        working-directory: app/server
        run: ./mvnw -B install -DskipTests

      - name: Executar testes
        run: ./mvnw -B test

  front:
    name: Front (flutter test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/converge
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # O .env é declarado como asset no pubspec.yaml e não é versionado.
      - name: Criar .env a partir do exemplo
        run: cp .env.example .env

      - name: Instalar dependências
        run: flutter pub get

      - name: Executar testes
        run: flutter test

  aprovado:
    name: Testes aprovados
    runs-on: ubuntu-latest
    needs: [server, backend, front]
    if: always()
    steps:
      - name: Verificar resultado dos 3 jobs
        run: |
          echo "server:  ${{ needs.server.result }}"
          echo "backend: ${{ needs.backend.result }}"
          echo "front:   ${{ needs.front.result }}"
          if [ "${{ needs.server.result }}" != "success" ] || \
             [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.front.result }}" != "success" ]; then
            echo "Um ou mais jobs de teste falharam."
            exit 1
          fi
